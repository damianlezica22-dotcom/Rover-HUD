<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ROVER MASTER</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { touch-action: none; -webkit-user-select: none; box-sizing: border-box; }
        body { background: #05000a; color: #cc00ff; font-family: 'Orbitron', sans-serif; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Video arriba */
        #video-container { width: 100%; height: 40%; background: #000; border-bottom: 2px solid #6600cc; position: relative; }
        #video-stream { width: 100%; height: 100%; object-fit: cover; }
        #terminal { position: absolute; top: 10px; right: 10px; width: 120px; height: 80px; font-size: 9px; color: #00ff00; background: rgba(0,0,0,0.5); padding: 5px; pointer-events: none; overflow: hidden; border-right: 2px solid #00ff00; }

        /* Controles abajo */
        .controls { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; padding: 10px; background: linear-gradient(to bottom, #05000a, #1a0033); }
        .row { display: flex; justify-content: space-around; width: 100%; align-items: center; }
        
        .btn { width: 90px; height: 90px; background: rgba(51, 0, 102, 0.6); border: 2px solid #9900cc; color: #fff; border-radius: 20px; font-size: 35px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(204, 0, 255, 0.4); }
        .btn:active { background: #cc00ff; color: #000; box-shadow: 0 0 30px #cc00ff; transform: scale(0.9); }
        
        .btn-small { width: 110px; height: 45px; font-size: 11px; background: #330066; border-color: #6600cc; border-radius: 8px; }
        .label { font-size: 10px; color: #9900cc; text-align: center; margin-bottom: 4px; font-weight: bold; }
        .group { display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="terminal">>> HUD READY</div>
        <img id="video-stream" src="http://192.168.0.187:8080/video" onerror="this.src=this.src;">
    </div>

    <div class="controls">
        <div class="row">
            <div class="group">
                <div class="label">TRACCIÓN</div>
                <button class="btn" ontouchstart="vibrate(); send('F')" ontouchend="send('S')">▲</button>
            </div>
            <div class="group">
                <button class="btn btn-small" style="background:#444400;" onclick="vibrate(); toggleFlash()">LED FLASH</button>
                <div style="height:10px;"></div>
                <button class="btn btn-small" style="background:#004444;" onclick="vibrate(); send('V190')">6V (SAFE)</button>
            </div>
        </div>

        <div class="row">
            <div class="group">
                <button class="btn" ontouchstart="vibrate(); send('B')" ontouchend="send('S')">▼</button>
            </div>
            <div class="group">
                <div class="label">GIRO PIVOT</div>
                <div style="display:flex; gap:10px;">
                    <button class="btn" ontouchstart="vibrate(); send('L')" ontouchend="send('S')">◀</button>
                    <button class="btn" ontouchstart="vibrate(); send('R')" ontouchend="send('S')">▶</button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="group">
                <div class="label">CURVAS SUAVES</div>
                <div style="display:flex; gap:15px;">
                    <button class="btn btn-small" style="background:rgba(0,100,0,0.4); width:140px; height:60px; font-size:16px;" ontouchstart="vibrate(); send('I')" ontouchend="send('S')">CURVA IZQ</button>
                    <button class="btn btn-small" style="background:rgba(0,100,0,0.4); width:140px; height:60px; font-size:16px;" ontouchstart="vibrate(); send('G')" ontouchend="send('S')">CURVA DER</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const IP = "192.168.0.187";
        let flash = false;
        function vibrate() { if(navigator.vibrate) navigator.vibrate(40); }
        function send(c) { 
            fetch(`http://${IP}:8081/comando?val=${c}`, {mode:'no-cors'});
            document.getElementById('terminal').innerHTML = `> TX: ${c}<br>` + document.getElementById('terminal').innerHTML.substring(0,60);
        }
        function toggleFlash() { 
            flash=!flash; 
            fetch(`http://${IP}:8080/enabletorch?${flash?'on':'off'}`).catch(e=>{}); 
        }
    </script>
</body>
</html>
